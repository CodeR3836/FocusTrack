
<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">

        <title>Document</title>
    </head>

    <body>
        <div class = "header">
            <p class="title">CodeR Task Tracker</p>
            <span  id="date"></span>
        </div>

        <div class="task-info">
            <div class="total-task">
                <p>TOTAL TASKS</p>
                <span id="total-task">0</span>
            </div>

            <div class="completed">
                <p>COMPLETED</p>
                <span id="completed">0</span>
            </div>

            <div class="remaining">
                <p>REMAINING</p>
                <span id="remaining">0</span>
            </div>

            <div class="progress">
                <p>PROGRESS</p>
                <span>0%</span>
            </div>
        </div>
        
        <div class="overall-progress">
            <div class="progress-header">
                <p>OVERALL PROGRESS</p>
                <span id="progress-text">0 out of 0 done</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="todo">
            <div class="mainbody">
                <div class="inputs">
                    <input class="input-bar" type="text" placeholder="Add a New Task">
                    <select class="todo-type">
                        <option value="work" selected>Work</option>
                        <option value="personal">Personal</option>
                        <option value="health">Health</option>
                        <option value="study">Study</option>
                        <option value="others">Others</option>
                    </select>
                    <select class="priority">
                        <option value="medium" selected>Medium</option>
                        <option value="easy">Easy</option>
                        <option value="hard">Hard</option>
                    </select>
                    <button class="add-btn">
                        ADD
                    </button>
                </div>

                <div class="sections" id="sections">
                    <div class="section active" data-type="all">
                        <p>ALL</p>
                        <span id="allcount">0</span>
                    </div>
                    
                    <div class="section" data-type="pending">
                        <p>Pending</p>
                        <span id="pendingcount">0</span>
                    </div>

                    <div class="section" data-type="done">
                        <p>Done</p>
                        <span id="donecount">0</span>
                    </div>
                </div>

                <div class="tasklist" id="taskList"></div>

                <div class="category-card">
                    <p>BY CATEGORY</p>

                    <div class="category-chart">
                        <div class="pie-chart" id="category-chart"></div>
                    </div>

                    <div class="categorylist" id="categorylist">
                        <div class="categoryname">
                            <span class="categorybox"></span>
                            <span>Work</span>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>
